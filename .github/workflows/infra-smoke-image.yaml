name: GroupOS Infrastructure Smoke Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "smoke/container/**"
      - ".github/workflows/infra-smoke-image.yaml"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push smoke image
        uses: docker/build-push-action@v7
        with:
          context: ./smoke/container
          file: ./smoke/container/Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/groupos-apps/groupos-infra-smoke:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GroupOs-Apps/infrastructure
            org.opencontainers.image.revision=${{ github.sha }}
