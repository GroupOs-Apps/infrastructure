apiVersion: v1
kind: ConfigMap
metadata:
  name: groupos-sops-cmp-config
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: groupos-sops
    spec:
      version: v1
      generate:
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu

            found=0

            for file in ./*.enc.yaml; do
              [ -f "$file" ] || continue

              found=1
              sops decrypt "$file"
              printf '\n---\n'
            done

            if [ "$found" -eq 0 ]; then
              echo "ERROR: No encrypted YAML files found" >&2
              exit 1
            fi
