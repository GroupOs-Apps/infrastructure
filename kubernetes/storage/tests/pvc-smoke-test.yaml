apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: groupos-storage-test
  namespace: groupos-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupos-storage-test
  namespace: groupos-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: groupos-storage-test
  template:
    metadata:
      labels:
        app: groupos-storage-test
    spec:
      containers:
        - name: storage-test
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 360000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: groupos-storage-test
