apiVersion: v1
kind: Pod
metadata:
  name: groupos-ghcr-smoke
  namespace: groupos-web
  labels:
    app: groupos-ghcr-smoke
spec:
  restartPolicy: Never

  imagePullSecrets:
    - name: groupos-ghcr

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: smoke
      image: ghcr.io/groupos-apps/groupos-infra-smoke:sha-8765d24a36e0f73b02c06a41c91779b070b1fbf2
      imagePullPolicy: Always

      ports:
        - containerPort: 8080

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
